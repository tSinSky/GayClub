<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кино-Бинго — Гражданин Кейн</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8D5A3;
    --dark: #1A1A1A;
    --darker: #0D0D0D;
    --cream: #F5F0E8;
    --gray: #8A8A8A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--darker);
    color: var(--cream);
    font-family: 'Cormorant Garamond', Georgia, serif;
  }

  @media print {
    body { background: white; color: black; }
    .no-print { display: none !important; }
    .bingo-sheet { 
      page-break-inside: avoid;
      box-shadow: none !important;
      border: 2px solid #333 !important;
      background: white !important;
      margin-bottom: 20px;
    }
    .bingo-sheet h2 { color: black !important; }
    .bingo-sheet .subtitle { color: #555 !important; }
    .bingo-cell { 
      border-color: #333 !important; 
      color: black !important;
      background: white !important;
    }
    .card-number { color: #999 !important; }
    .header-section { display: none !important; }
    .cards-container {
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 20px !important;
      padding: 10px !important;
    }
    .tip { color: #999 !important; }
  }

  /* Header */
  .header-section {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
  }

  .header-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, rgba(201,168,76,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-section h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 900;
    font-size: 3.5rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 2px 20px rgba(201,168,76,0.3);
    margin-bottom: 8px;
  }

  .header-section .film-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.5rem;
    font-weight: 400;
    color: var(--gray);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 30px;
  }

  .header-section .divider {
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 25px;
  }

  .header-section .instructions {
    max-width: 600px;
    margin: 0 auto;
    font-size: 1.1rem;
    line-height: 1.7;
    color: var(--gold-light);
    opacity: 0.8;
  }

  .print-btn {
    display: inline-block;
    margin-top: 30px;
    padding: 14px 40px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .print-btn:hover {
    background: var(--gold);
    color: var(--darker);
  }

  /* Cards Grid */
  .cards-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 30px;
  }

  /* Individual Bingo Sheet */
  .bingo-sheet {
    background: var(--dark);
    border: 1px solid rgba(201,168,76,0.3);
    padding: 20px 16px 16px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .bingo-sheet h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: 1.3rem;
    text-align: center;
    color: var(--gold);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .bingo-sheet .subtitle {
    text-align: center;
    font-size: 0.8rem;
    color: var(--gray);
    letter-spacing: 0.15em;
    margin-bottom: 12px;
  }

  .card-number {
    position: absolute;
    top: 10px;
    right: 12px;
    font-size: 0.75rem;
    color: rgba(201,168,76,0.4);
    letter-spacing: 0.1em;
  }

  /* Bingo Grid */
  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 1px solid rgba(201,168,76,0.4);
  }

  .bingo-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    border: 1px solid rgba(201,168,76,0.15);
    font-size: 0.78rem;
    line-height: 1.35;
    color: var(--cream);
    transition: background 0.2s;
  }

  .bingo-cell:hover {
    background: rgba(201,168,76,0.05);
  }

  .tip {
    text-align: center;
    margin-top: 10px;
    font-size: 0.7rem;
    color: var(--gray);
    letter-spacing: 0.05em;
    font-style: italic;
  }

  @media (max-width: 400px) {
    .cards-container {
      grid-template-columns: 1fr;
      padding: 10px;
    }
    .header-section h1 { font-size: 2rem; }
    .bingo-cell { font-size: 0.65rem; padding: 5px; }
  }
</style>
</head>
<body>

<div class="header-section no-print">
  <h1>Кино-Бинго</h1>
  <div class="film-title">Гражданин Кейн · 1941</div>
  <div class="divider"></div>
  <p class="instructions">
    Заметил — отметил. Собери четыре в ряд по горизонтали, вертикали или диагонали. 
    Проверяем после фильма.
  </p>
  <button class="print-btn" onclick="window.print()">Распечатать карточки</button>
</div>

<div class="cards-container" id="cards"></div>

<script>
const allItems = [
  "Камера снимает снизу вверх",
  "В кадре виден потолок",
  "Персонаж в тени или силуэт",
  "Газетный заголовок крупным планом",
  "Кто-то произносит «Rosebud»",
  "Аплодисменты в сцене",
  "Персонаж произносит речь",
  "Отражение в зеркале или стекле",
  "Дым или туман в кадре",
  "Стакан или бокал крупным планом",
  "Большая толпа людей",
  "Кто-то кричит или ссорится",
  "Роскошный интерьер",
  "Кто-то пьёт алкоголь",
  "Снег или зима",
  "Ворота или забор",
  "Резкость на всех планах сразу",
  "Фото или портрет крупным планом",
  "Журналист задаёт вопросы",
  "Персонаж один в большом помещении",
  "Длинная тень на стене",
  "Статуя или скульптура",
  "Музыка резко меняет настроение",
  "Кто-то печатает на машинке",
  "Телефонный разговор",
  "Птица в кадре",
  "Персонаж поёт или играет музыку",
  "Кто-то читает газету"
];

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 1664525 + 1013904223) & 0xFFFFFFFF;
    return (s >>> 0) / 0xFFFFFFFF;
  };
}

function shuffleWithSeed(arr, seed) {
  const rng = seededRandom(seed);
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function generateCard(cardIndex) {
  const shuffled = shuffleWithSeed(allItems, cardIndex * 7919 + 42);
  return shuffled.slice(0, 16);
}

function createCardHTML(cardIndex) {
  const items = generateCard(cardIndex);
  
  let cellsHTML = items.map(item => {
    return `<div class="bingo-cell">${item}</div>`;
  }).join('');

  return `
    <div class="bingo-sheet">
      <span class="card-number">№${cardIndex + 1}</span>
      <h2>Кино-Бинго</h2>
      <div class="subtitle">Гражданин Кейн · 1941</div>
      <div class="bingo-grid">${cellsHTML}</div>
      <div class="tip">Заметил — отметил ✓</div>
    </div>
  `;
}

const container = document.getElementById('cards');
let html = '';
for (let i = 0; i < 8; i++) {
  html += createCardHTML(i);
}
container.innerHTML = html;
</script>

</body>
</html>
